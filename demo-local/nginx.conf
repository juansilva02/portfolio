resolver 127.0.0.11 valid=5s ipv6=off;
server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_tickets off;
ssl_session_cache shared:TLS:10m;
client_body_timeout 15s;
client_header_timeout 15s;
send_timeout 30s;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
# OAuth return URLs contain short-lived codes. Never write request URLs to logs.
access_log off;
error_log /dev/null;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 443 ssl;
    server_name localhost auth-proxy;
    ssl_certificate /certs/local.crt;
    ssl_certificate_key /certs/local.key;
    client_max_body_size 32k;
    access_log off;
    location /auth/ {
        proxy_pass http://broker:8080/;
        proxy_set_header X-Demo-Host "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/demo/ {
        proxy_pass http://broker:8080/signup/;
        proxy_set_header X-Demo-Host "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /demo/d- {
        proxy_pass http://broker:8080;
    }
    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_http_version 1.1;
    }
}
server {
    listen 443 ssl;
    server_name "~^d-(?<legacy_id>[a-f0-9]{32})\.demo\.localhost$";
    ssl_certificate /certs/local.crt;
    ssl_certificate_key /certs/local.key;
    access_log off;
    location / {
        proxy_pass http://broker:8080/signup/legacy/$legacy_id;
        proxy_set_header X-Original-URI $request_uri;
    }
}
server {
    listen 443 ssl;
    server_name "~^(?<demo_name>[a-z0-9][a-z0-9-]{0,62})\.demo\.localhost$";
    ssl_certificate /certs/local.crt;
    ssl_certificate_key /certs/local.key;
    client_max_body_size 12m;
    access_log off;
    auth_request /_demo_resolve;
    auth_request_set $demo_id $upstream_http_x_demo_id;
    location = /_demo_resolve {
        internal;
        auth_request off;
        proxy_pass http://broker:8080/signup/resolve;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Demo-Host $host;
    }
    location /api/ {
        proxy_pass http://demo-$demo_id-api:4000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /uploads/ {
        proxy_pass http://demo-$demo_id-api:4000;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://demo-$demo_id-web:3000;
        proxy_set_header Host $http_host;
    }
}
