name: zd-demo-local
services:
  broker:
    build: ${ERP_ROOT}/deploy/auth-broker
    environment:
      BROKER_ORIGIN: https://localhost:8443
      BROKER_PATH: /auth
      BROKER_ALLOW_LOCAL: '1'
      BROKER_INSTANCES: '{}'
      BROKER_PROVIDERS: '{}'
      GOOGLE_CLIENT_FILE: /run/secrets/google.json
      ENABLE_DEMO_SIGNUP: '1'
      DEMO_PORTAL_ORIGIN: https://localhost:8443
      DEMO_ORIGIN_TEMPLATE: https://{subdomain}.demo.localhost:8443
    volumes:
      - control-data:/data
      - ${GOOGLE_OAUTH_FILE}:/run/secrets/google.json:ro
    networks: [control]
  proxy:
    image: nginx:1.28-alpine
    container_name: zd-demo-local-proxy
    ports:
      - 127.0.0.1:8443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - local-certs:/certs:ro
    networks: [control]
    extra_hosts: [host.docker.internal:host-gateway]
    depends_on: [broker]
  worker:
    build:
      context: .
      dockerfile: Worker.Dockerfile
    environment:
      BROKER_DB: /data/auth.sqlite
      API_IMAGE: zd-demo-local-api:dev
      WEB_IMAGE: zd-demo-local-web:dev
      MAX_DEMOS: ${MAX_DEMOS:-2}
    volumes:
      - control-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [control]
    depends_on: [broker]
volumes:
  control-data:
  local-certs:
    external: true
    name: zd-demo-local-certs
networks:
  control:
